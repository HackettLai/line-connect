<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Using the connector config</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #0f1420;
        color: #e6e9f0;
        padding: 20px;
      }

      /* ============================================================
     REQUIRED CONTAINER SETUP
     ------------------------------------------------------------
     The container that holds your elements AND the SVG overlay
     MUST be position: relative. All connector coordinates are
     computed relative to this container's top-left corner.
     ============================================================ */
      .diagram {
        position: relative;
        height: 400px;
        border: 1px solid #2a3247;
        border-radius: 12px;
      }

      .box {
        position: absolute;
        padding: 18px 24px;
        background: #223052;
        border: 1px solid #3d5aa8;
        border-radius: 10px;
      }
      #card1 {
        left: 10%;
        top: 15%;
      }
      #card2 {
        left: 60%;
        top: 60%;
      }
      #card3 {
        left: 15%;
        top: 70%;
      }

      /* ============================================================
     REQUIRED SVG OVERLAY SETUP
     ------------------------------------------------------------
     - Must fill the container exactly (inset: 0 + 100% size),
       otherwise coordinates won't line up.
     - pointer-events: none so the overlay never blocks clicks
       on the elements underneath it.
     ============================================================ */
      .connector-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* ============================================================
     GLOBAL CONNECTOR STYLE
     ------------------------------------------------------------
     Style ALL connector lines in one place by targeting a shared
     class. Every <path> you add for a connector should carry
     class="connector".

     NOTE: for SVG, use `stroke`, `stroke-width`, `fill` etc.
     (not `color`, `border`, `background`).
     ============================================================ */
      .connector {
        fill: none; /* REQUIRED — otherwise the path gets filled as a shape */
        stroke: #6ea8ff; /* line color for all connectors */
        stroke-width: 2.5; /* line thickness */
        stroke-linejoin: round; /* rounded elbow corners */
        stroke-linecap: round; /* rounded line ends */
      }

      /* ------------------------------------------------------------
     PER-LINE OVERRIDES (optional)
     Give a specific path an extra class or id to override the
     global style for just that line.
     ------------------------------------------------------------ */
      .connector--danger {
        stroke: #f87171; /* red variant */
      }
      .connector--dashed {
        stroke-dasharray: 6 5; /* dashed variant */
      }

      /* ------------------------------------------------------------
     OPTIONAL: animated "flow" effect for any dashed connector.
     Apply class "connector--flow" to a path to use it.
     ------------------------------------------------------------ */
      .connector--flow {
        stroke-dasharray: 6 5;
        animation: connector-flow 0.6s linear infinite;
      }
      @keyframes connector-flow {
        to {
          stroke-dashoffset: -11;
        } /* = dash + gap, for a seamless loop */
      }

      /* ============================================================
     ADDED: SOURCE-CODE VIEWER PANEL
     ------------------------------------------------------------
     Display-only. Not part of the connector system — safe to
     delete this block (plus the panel HTML and the viewer
     script at the bottom) without affecting the diagram.
     ============================================================ */
      .source-panel {
        margin-top: 16px;
        background: #171e30;
        border: 1px solid #2a3247;
        border-radius: 12px;
        padding: 14px;
        position: relative;
      }
      .source-panel h2 {
        font-size: 15px;
        margin: 0 0 10px;
        color: #a8c7fa;
      }
      #source-view {
        background: #0f1420;
        border: 1px solid #2a3247;
        border-radius: 8px;
        padding: 14px;
        margin: 0;
        font-family: 'Consolas', 'Fira Mono', monospace;
        font-size: 12px;
        line-height: 1.5;
        color: #a8c7fa;
        white-space: pre;
        overflow: auto;
        max-height: 480px;
      }
      #copy-all-btn {
        position: absolute;
        top: 12px;
        right: 14px;
        background: #3d5aa8;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 16px;
        font-size: 13px;
        cursor: pointer;
      }
      #copy-all-btn:hover {
        background: #4a6cc4;
      }
      #copy-all-btn.ok {
        background: #166534;
      }
    </style>
  </head>
  <body>
    <div class="diagram" id="diagram">
      <div class="box" id="card1">Card 1</div>
      <div class="box" id="card2">Card 2</div>
      <div class="box" id="card3">Card 3</div>

      <!-- ============================================================
       ONE SVG, MANY PATHS
       ------------------------------------------------------------
       You only need ONE <svg> overlay per container, no matter
       how many connectors you draw. Add one <path> per connector.

       Rules per <path>:
         - unique id            (so JS can find it)
         - class="connector"    (picks up the global style)
         - optional extra class (per-line override, e.g. connector--danger)
         - marker-end for an arrowhead (optional, defined once in <defs>)
       ============================================================ -->
      <svg class="connector-svg" id="connSvg">
        <defs>
          <!-- Arrowhead — defined ONCE, reused by any path via marker-end.
           fill sets the arrow color. If you need arrows in multiple
           colors, duplicate this marker with a different id + fill,
           e.g. id="arrow-red". -->
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ea8ff" />
          </marker>
          <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171" />
          </marker>
        </defs>

        <!-- Connector 1: uses global style only -->
        <path id="conn1" class="connector" marker-end="url(#arrow)" />

        <!-- Connector 2: global style + red override + red arrow -->
        <path id="conn2" class="connector connector--danger" marker-end="url(#arrow-red)" />

        <!-- Connector 3: global style + animated dashed flow, no arrow -->
        <path id="conn3" class="connector connector--flow" />

        <!-- Connector 4: uses global style only -->
        <path id="conn4" class="connector" marker-end="url(#arrow)" />
      </svg>
    </div>

    <!-- ============================================================
     ADDED: SOURCE-CODE VIEWER — sits directly under #diagram.
     The <pre> is filled by the viewer script at the bottom of
     the page. Delete this block (plus its CSS and script) to
     remove the feature; the diagram is unaffected.
     ============================================================ -->
    <div class="source-panel">
      <h2>Full source code</h2>
      <button id="copy-all-btn">Copy all code</button>
      <pre id="source-view">Loading source…</pre>
    </div>

    <script>
      /* ============================================================
   STEP 1 — PASTE YOUR CONFIGS FROM THE GENERATOR
   ------------------------------------------------------------
   Each time you design a line in the generator, hit Copy and
   paste the `const connector = [...]` array here. Rename the
   variable per line (connector1, connector2, ...) or, better,
   put them straight into the CONNECTORS registry in Step 3.

   If you renamed the node IDs inside the generator to match
   your real elements, the configs work as-is. Otherwise, edit
   the xEl / yEl values to point at your real element IDs.
   ============================================================ */

      // Generated in the tool: card1 (right) --> elbow --> card2 (top)
      const connector1 = [
        { xEl: 'card1', xAnchor: 'right', xOffset: +0, yEl: 'card1', yAnchor: 'center', yOffset: +0 },
        { xEl: 'card2', xAnchor: 'center', xOffset: +0, yEl: 'card1', yAnchor: 'center', yOffset: +0 },
        { xEl: 'card2', xAnchor: 'center', xOffset: +0, yEl: 'card2', yAnchor: 'top', yOffset: -4 },
      ];

      // Generated in the tool: card1 (bottom) --> elbow --> card3 (top)
      const connector2 = [
        { xEl: 'card1', xAnchor: 'center', xOffset: +0, yEl: 'card1', yAnchor: 'bottom', yOffset: +0 },
        { xEl: 'card1', xAnchor: 'center', xOffset: +0, yEl: 'card3', yAnchor: 'top', yOffset: -20 },
        { xEl: 'card3', xAnchor: 'center', xOffset: +0, yEl: 'card3', yAnchor: 'top', yOffset: -20 },
        { xEl: 'card3', xAnchor: 'center', xOffset: +0, yEl: 'card3', yAnchor: 'top', yOffset: -4 },
      ];

      // Generated in the tool: card3 (right) --> elbow --> card2 (left)
      const connector3 = [
        { xEl: 'card3', xAnchor: 'right', xOffset: +0, yEl: 'card3', yAnchor: 'center', yOffset: +0 },
        { xEl: 'card2', xAnchor: 'left', xOffset: -20, yEl: 'card3', yAnchor: 'center', yOffset: +0 },
        { xEl: 'card2', xAnchor: 'left', xOffset: -20, yEl: 'card2', yAnchor: 'center', yOffset: +0 },
        { xEl: 'card2', xAnchor: 'left', xOffset: -4, yEl: 'card2', yAnchor: 'center', yOffset: +0 },
      ];

      const connector4 = [
        { xEl: 'card1', xAnchor: 'right', xOffset: +0, yEl: 'card1', yAnchor: 'center', yOffset: +0 },
        { xEl: 'card2', xAnchor: 'center', xOffset: +0, yEl: 'card2', yAnchor: 'top', yOffset: +0 },
      ];

      d = 'M 230.2 119.5 L 950.0 404.1';

      d = 'M 230.2 138.8 L 950.0 138.8 L 950.0 492.7';

      /* ============================================================
   STEP 2 — THE RUNTIME (copy once, never edit)
   ------------------------------------------------------------
   Resolves one config array into pixel coordinates relative to
   the container, and writes the result into the path's `d`
   attribute. Works for any number of points (start, mids, end).
   ============================================================ */
      function drawConnector(container, pathEl, config) {
        const cRect = container.getBoundingClientRect();

        const d = config
          .map((pt, i) => {
            const xr = document.getElementById(pt.xEl).getBoundingClientRect();
            const yr = document.getElementById(pt.yEl).getBoundingClientRect();

            // X coordinate: chosen edge of the X-element, plus offset
            const x = (pt.xAnchor === 'left' ? xr.left : pt.xAnchor === 'right' ? xr.right : xr.left + xr.width / 2) - cRect.left + (pt.xOffset || 0);

            // Y coordinate: chosen edge of the Y-element, plus offset
            const y = (pt.yAnchor === 'top' ? yr.top : pt.yAnchor === 'bottom' ? yr.bottom : yr.top + yr.height / 2) - cRect.top + (pt.yOffset || 0);

            return (i === 0 ? 'M' : 'L') + ` ${x} ${y}`;
          })
          .join(' ');

        pathEl.setAttribute('d', d);
      }

      /* ============================================================
   STEP 3 — REGISTER YOUR CONNECTORS (the scalable pattern)
   ------------------------------------------------------------
   Instead of calling drawConnector() manually N times in N
   places, list every connector once here. `redrawAll()` loops
   over the registry, so adding a new line is exactly 3 steps:

     1. Add a <path id="connX" class="connector"/> to the SVG
     2. Paste the config from the generator
     3. Add one entry to this array

   Nothing else changes.
   ============================================================ */
      const diagram = document.getElementById('diagram');

      const CONNECTORS = [
        { pathId: 'conn1', config: connector1 },
        { pathId: 'conn2', config: connector2 },
        { pathId: 'conn3', config: connector3 },
        { pathId: 'conn4', config: connector4 },
      ];

      function redrawAll() {
        CONNECTORS.forEach(({ pathId, config }) => {
          drawConnector(diagram, document.getElementById(pathId), config);
        });
      }

      /* ============================================================
   STEP 4 — DRAW NOW + REDRAW ON LAYOUT CHANGES
   ------------------------------------------------------------
   ResizeObserver catches the container resizing (flex/grid
   reflow, sidebar collapse, etc). The window resize listener
   is a belt-and-braces fallback.

   IMPORTANT: if you MOVE elements with JS or animation (not
   just resizing), those events are NOT caught here. Call
   redrawAll() yourself after such changes, e.g.:

     moveCardSomewhere();
     redrawAll();

   Or during a continuous animation:

     function animate() {
       // ...move stuff...
       redrawAll();
       requestAnimationFrame(animate);
     }
   ============================================================ */
      redrawAll();
      new ResizeObserver(redrawAll).observe(diagram);
      window.addEventListener('resize', redrawAll);
    </script>

    <script>
      /* ============================================================
     ADDED: SOURCE VIEWER + COPY BUTTON
     ------------------------------------------------------------
     Kept in its OWN <script> so the original connector script
     above stays 100% untouched.

     How the source is obtained (two strategies):

       1. fetch(location.href) — returns the RAW file exactly as
          it exists on disk: byte-for-byte, all comments, all
          formatting. Works whenever the page is served over
          http(s). This is the preferred path.

       2. Fallback (fetch blocked, e.g. file:// or a sandboxed
          preview): serialize the live DOM. Because redrawAll()
          has already injected computed d="M 230.2 ..." values
          into the connector paths, we serialize a CLONE with
          those runtime attributes stripped, so the displayed
          code stays clean. Note: DOM serialization normalizes
          minor syntax (e.g. `<path />` becomes `<path></path>`)
          but all comments and code are preserved.
     ============================================================ */
      (function () {
        const view = document.getElementById('source-view');
        const btn = document.getElementById('copy-all-btn');
        let fullSource = '';

        function buildFromDOM() {
          const clone = document.documentElement.cloneNode(true);
          // Strip runtime-computed geometry so paths look like the original file
          clone.querySelectorAll('path.connector').forEach((p) => p.removeAttribute('d'));
          // Empty the viewer's own <pre> in the clone (avoid embedding source-within-source)
          const preClone = clone.querySelector('#source-view');
          if (preClone) preClone.textContent = '';
          return '<!doctype html>\n' + clone.outerHTML;
        }

        fetch(location.href)
          .then((r) => {
            if (!r.ok) throw new Error(r.status);
            return r.text();
          })
          .then((text) => {
            fullSource = text;
            view.textContent = fullSource; // textContent auto-escapes < and >
          })
          .catch(() => {
            fullSource = buildFromDOM();
            view.textContent = fullSource;
          });

        btn.addEventListener('click', () => {
          const done = () => {
            btn.textContent = 'Copied!';
            btn.classList.add('ok');
            setTimeout(() => {
              btn.textContent = 'Copy all code';
              btn.classList.remove('ok');
            }, 1400);
          };
          navigator.clipboard.writeText(fullSource).then(done).catch(() => {
            // Fallback for environments where the Clipboard API is blocked
            const ta = document.createElement('textarea');
            ta.value = fullSource;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            done();
          });
        });
      })();
    </script>
  <!-- Code injected by live-server -->
<script>
	// <![CDATA[  <-- For SVG support

		(function () {
			function refreshCSS() {
				var sheets = [].slice.call(document.getElementsByTagName("link"));
				var head = document.getElementsByTagName("head")[0];
				for (var i = 0; i < sheets.length; ++i) {
					var elem = sheets[i];
					var parent = elem.parentElement || head;
					parent.removeChild(elem);

						var url = elem.href.replace(/(&|\?)_cacheOverride=\d+/, '');
						elem.href = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_cacheOverride=' + (new Date().valueOf());

			}
			var protocol = window.location.protocol === 'http:' ? 'ws://' : 'wss://';
			var address = protocol + window.location.host + window.location.pathname + '/ws';
			var socket = new WebSocket(address);
			socket.onmessage = function (msg) {
				if (msg.data == 'reload') window.location.reload();
				else if (msg.data == 'refreshcss') refreshCSS();
			};
			if (sessionStorage && !sessionStorage.getItem('IsThisFirstTime_Log_From_LiveServer')) {
				console.log('Live reload enabled.');

			}
		})();
	}
	else {
		console.error('Upgrade your browser. This Browser is NOT supported WebSocket for Live-Reloading.');
	}
	// ]]>
</script>
</body>
</html>
